[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/catskinroyale/kibble-481"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustysynth = "1.3.8"
midly = "0.5.3"
hound = "3.5.1"
dd-dsp = { path = "crates/dd-dsp" }
dd-seq = { path = "crates/dd-seq" }
dd-gallery = { path = "crates/dd-gallery" }

# The synth runs in real time, so keep debug builds reasonably fast too.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[profile.test]
opt-level = 2
